name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # The recovery tool shares no code with the plugin. Running it against the
      # same vectors is what proves the two implementations agree.
      - name: Verify golden vectors against the standalone decryptor
        run: npm run verify:vectors

      - name: Check formatting
        run: npm run format:check
